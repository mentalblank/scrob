name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

# A branch only needs its newest commit checked.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: astro check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # check runs sync itself, but a cold checkout has no .astro/types.d.ts
      # and the generated types are what the page props are checked against.
      - name: Generate Astro types
        run: npx astro sync
        working-directory: frontend

      - name: Type-check
        run: npx astro check
        working-directory: frontend

  backend:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --group dev
        working-directory: backend

      - name: Run tests
        run: uv run pytest -q
        working-directory: backend
